[project]
name = "codepilot"
version = "1.0.0"
description = "CodePilot – The Knowledge of Athena (Advanced Code Intelligence & Multi-Agent Platform)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CodePilot Engineering Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.4",
    "sqlalchemy>=2.0.28",
    "celery>=5.3.6",
    "redis>=5.0.2",
    "neo4j>=5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
